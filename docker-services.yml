services:
  app:
    build:
      context: ./
      args:
        - ENVIRONMENT=DEV
    image: asclepias-broker
    environment:
      - "INVENIO_ACCOUNTS_SESSION_REDIS_URL=redis://cache:6379/1"
      - "INVENIO_BROKER_URL=amqp://guest:guest@mq:5672/"
      - "INVENIO_CACHE_REDIS_URL=redis://cache:6379/0"
      - "INVENIO_CACHE_TYPE=redis"
      - "INVENIO_RATELIMIT_STORAGE_URI=redis://cache:6379/3"
      - "INVENIO_CELERY_BROKER_URL=amqp://guest:guest@mq:5672/"
      - "INVENIO_CELERY_RESULT_BACKEND=redis://cache:6379/2"
      - "INVENIO_SEARCH_ELASTIC_HOSTS=['es:9200']"
      - "INVENIO_SECRET_KEY=CHANGE_ME"
      - "INVENIO_SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://asclepias:asclepias@db/asclepias"
      - "INVENIO_WSGI_PROXIES=2"
      - "INVENIO_INSTANCE_PATH=/opt/invenio/var/instance/"
      - "SLACK_API_TOKEN=CHANGE_ME"
  lb:
    build: ./docker/haproxy/
    image: asclepias-broker-lb
    restart: "always"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
  frontend:
    build: ./docker/nginx/
    image: asclepias-broker-frontend
    restart: "always"
    ports:
      - "80"
      - "443"
  cache:
    image: redis:7.2.1
    restart: "always"
    read_only: true
    ports:
      - "6379:6379"
  db:
    image: postgres:15.15
    restart: "always"
    environment:
      - "POSTGRES_USER=asclepias"
      - "POSTGRES_PASSWORD=asclepias"
      - "POSTGRES_DB=asclepias"
    ports:
      - "5432:5432"
  mq:
    image: rabbitmq:3.12.6-management
    volumes:
      - "./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf"
    restart: "always"
    ports:
      - "15672:15672"
      - "5672:5672"
  search:
    image: opensearchproject/opensearch:3.4.0
    restart: "always"
    environment:
      - bootstrap.memory_lock=true
      - discovery.type=single-node
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 2g
    ports:
      - "9200:9200"
      - "9300:9300"
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:3.4.0
    environment:
      - OPENSEARCH_HOSTS=http://search:9200
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports: ['5601:5601']
  flower:
    image: mher/flower
    command: celery flower --broker=amqp://guest:guest@mq:5672/ --broker_api=http://guest:guest@mq:15672/api/
    ports:
      - "5555:5555"
